services:
  cfsmcp:
    build: .
    ports:
      - "8558:8558"
    environment:
      HOST: "0.0.0.0"
      PORT: "8558"
      METADATA_DIR: /data/metadata
      DB_PATH: /data/cfsmcp.sqlite3
      ZVEC_DIR: /data/zvec
      LM_STUDIO_URL: http://host.docker.internal:1234
      EMBEDDING_WORKERS: "2"
      EMBEDDING_BATCH_SIZE: "128"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
