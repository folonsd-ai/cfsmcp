[project]
name = "cfsmcp"
version = "0.1.0"
description = "MCP server for 1C metadata structure search"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0",
    "zvec>=0.6.0",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
]

[project.scripts]
cfsmcp = "app.main:run"

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
